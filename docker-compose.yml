# Docker Compose untuk staging BayarKilat di Dokploy.
# Env (APP_KEY, APP_ENV, APP_URL, dll) diisi lewat UI Dokploy (tab Environment),
# lalu ditulis Dokploy ke file `.env` di samping file ini saat deploy.
# Referensi variabel: .env.staging.example
services:
  app:
    build:
      context: .
    image: bayarkilat-app:staging
    restart: unless-stopped
    env_file:
      - .env
    # Container tidak dibuka ke host — akses via domain/Traefik (Dokploy menambah
    # network 'dokploy-network' + label Traefik otomatis saat domain diatur di UI).
    # Port 8000 = listener server FrankenPHP mode Octane (lihat CMD di Dockerfile).
    expose:
      - "8000"
    # DB memakai service MySQL eksternal (Dokploy) — tidak ada volume DB di sini.
    volumes:
      - bayarkilat_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/up >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bayarkilat_storage:
