# Docker Compose untuk staging BayarKilat (single instance, HTTP polos port 8080).
# Kelola env staging dari file .env.staging (jangan di-commit ke git).
services:
  app:
    build:
      context: .
    image: bayarkilat-app:staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
    ports:
      - "8080:80"
    volumes:
      - bayarkilat_sqlite:/app/database
      - bayarkilat_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bayarkilat_sqlite:
  bayarkilat_storage: